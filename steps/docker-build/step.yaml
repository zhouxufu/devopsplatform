apiVersion: deploy.logplatform.io/v1
id: docker-build
name: Docker 构建并推送
description: 使用 buildx 构建镜像，推送镜像仓库并输出不可变 digest
category: 打包
kind: package
produces: oci-image
params:
  - {name: IMAGE_NAME, type: input, label: 镜像名称（含 registry/repository）}
  - {name: CONTEXT, type: input, label: 构建上下文, default: "."}
  - {name: DOCKERFILE, type: input, label: Dockerfile, default: "Dockerfile"}
  - {name: PLATFORMS, type: input, label: 目标平台（可选）, default: ""}
  - name: PUSH
    type: select
    label: 推送镜像仓库
    default: "true"
    options:
      - {value: "true", label: 是（可部署）}
      - {value: "false", label: 否（仅本机验证）}
