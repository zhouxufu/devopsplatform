<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>交付工作项验收（合成数据）</title><div id="app"></div><script type="module">
import {defineComponent,h,ref} from 'vue'
import {createApp} from './src/shared/app.js'
import WorkItemsTable from './src/deploy/components/WorkItemsTable.vue'
import './src/shared/theme.css'
const calls=[],events=[]
const base={source:'manual',kind:'bug',status:'open',external_status:'resolved',assigned_to:'alice',resolved_by:'alice',owner:'alice',person_labels:{alice:'研发甲'},ready_count:1,change_count:1,preparation:'ready',linked_items:[],ownership:'self',release_required:true,delivery_status:'not_started',source_checked_at:1792650467}
const production=[{...base,id:1,external_id:'26557',title:'主 Bug · 聚合上线',change_count:2,ready_count:2,ownership:'aggregated',linked_items:[{id:2,external_id:'26543',title:'随主项修复的子 Bug'}],delivery_status:'success',run_id:11,delivery_environment:'华东生产'},...Array.from({length:20},(_,i)=>({...base,id:i+10,title:'独立交付 '+(i+1),external_id:String(27000+i)}))]
const pending=[{...base,id:3,external_id:'26636',title:'仅测试修复 · 生产归属待确定',release_required:false,ownership:'unassigned',delivery_status:'not_started',ready_count:0,preparation:'draft'}]
let fail=false
const api=async address=>{const u=new URL(address,'http://fixture/');calls.push(address);await new Promise(r=>setTimeout(r,30));if(u.pathname!=='/api/work-items/delivery-page')throw Error('禁止未知夹具接口');if(fail)return{items:[],total:0,page:1,page_size:20,source_errors:['fixture：模拟来源连接失败'],checked_at:1792650467};const scope=u.searchParams.get('scope');let rows=scope==='unassigned'?pending:scope==='nonproduction'?[...production,...pending]:production;const term=u.searchParams.get('q');if(term)rows=rows.filter(w=>w.title.includes(term)||w.external_id.includes(term)||w.linked_items.some(c=>c.title.includes(term)||c.external_id.includes(term)));const page=Number(u.searchParams.get('page')||1),size=Number(u.searchParams.get('page_size')||20);return{items:rows.slice((page-1)*size,page*size),total:rows.length,page,page_size:size,source_errors:[],checked_at:1792650467}}
createApp(defineComponent({setup(){const last=ref('');const event=(kind,item)=>{events.push({kind,id:typeof item==='number'?item:item.id});last.value=kind+' '+(item.id||item)};return()=>h('main',{style:'padding:24px'},[h('h2','交付工作项 · 隔离验收'),h('p','以下均为合成数据；不连接禅道，不执行交付。'),h(WorkItemsTable,{me:{username:'alice',role:'admin',auth_enabled:true},canManage:()=>true,environments:[{name:'verify',display_name:'验证区',purpose:'test'},{name:'east',display_name:'华东生产',purpose:'production'}],onView:v=>event('查看来源',v),onDelivery:v=>event('维护归属',v),onVersion:v=>event('选择版本',v),onRun:v=>event('查看执行',v)}),h('button',{onClick:()=>{fail=!fail;last.value=fail?'已设置来源失败，请点刷新':'已恢复来源，请点刷新'}},'模拟 / 恢复来源故障'),h('p',{role:'status'},last.value),h('details',null,[h('summary','只读验收台账'),h('pre',JSON.stringify({calls,events},null,2))])])}})).provide('api',api).mount('#app')
</script></html>
