services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=7d
      - -retention.maxDiskSpaceUsageBytes=20GiB
      - -inmemoryDataFlushInterval=1s
      - -insert.maxLineSizeBytes=2MiB
      - -memory.allowedBytes=256MiB
    environment:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1GiB
    volumes:
      - victorialogs:/storage
    restart: unless-stopped
  logs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    command: [-addr, ':9801', -admin-addr, ':19801', -data, /data, -victorialogs-url, 'http://victorialogs:9428', -disk-gb, '2']
    environment:
      DEVOPSPLATFORM_DATA_TOKEN: ${DEVOPSPLATFORM_DATA_TOKEN:?Set the shared Agent data token}
    volumes:
      - log-state:/data
    ports:
      - '9801:9801'
      - '127.0.0.1:19801:19801'
    depends_on:
      - victorialogs
    restart: unless-stopped
volumes:
  victorialogs:
  log-state:
